<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kioski</title>
<style>
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(font/plex-mono-400.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(font/plex-mono-500.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:600 700;src:url(font/plex-mono-600.ttf) format("truetype")}
:root{--bg:#0A0C08;--card:#0F120D;--field:#080A06;--line:#2C3127;--ink:#D9DCCB;--muted:#8E937F;--amber:#F5B400;--amberbg:#231E0C;--amberline:#7A5E12;--blue:#5EC8D8;--bad:#EF5B50;--badbg:#2E1714;--badline:#74302A;--ok:#86CF6A;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--mono)}
main{max-width:1240px;margin:0 auto;padding:20px 20px 72px}
@media (max-width:600px){ main{padding:14px 16px 64px} }
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
h2{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{min-height:42px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:#141811;color:var(--ink);font:600 14px var(--mono);letter-spacing:.05em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:#3A4652}
button.primary,.btn.primary{background:var(--amberbg);border-color:var(--amberline);color:var(--amber);text-transform:uppercase}
button.danger{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
button:disabled{opacity:.5;cursor:wait}
input,select{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 12px;font:15px var(--mono);min-height:42px;min-width:0}
input:focus,select:focus,button:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px}
.all{margin-bottom:20px}
.all .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 16px}
.all label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.14em;text-transform:uppercase}
.all .row input{flex:1}
.all label.btn{display:inline-flex;margin:0;font-size:14px;color:var(--ink)}
.kiosks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){ .kiosks{grid-template-columns:1fr} }
.k{display:flex;flex-direction:column;gap:12px}
.k.off{opacity:.75}
.k .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.k .name{font-size:17px;font-weight:600;line-height:1.3;color:var(--amber)}
.k .sub{font-size:13px;color:var(--muted)}
.vbadge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.vbadge.new{color:#F2A900;border-color:#7A5E12;background:#231E0C}
.upd{padding:12px 16px;margin-bottom:16px;border-color:#7A5E12;color:#F2A900}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:1px;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--field);border:1px solid var(--line);border-radius:4px;color:var(--amber);padding:3px 10px;font-size:13px;white-space:nowrap}
.chips b{color:var(--muted);font-weight:500;margin-right:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.k .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k .acts .wide{grid-column:1/-1}
.k select{width:100%}
.err{color:var(--bad);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:20px;width:min(560px,94vw)}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
dialog input{width:100%}
.hint{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,640px);background:#1D252D;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;white-space:pre-wrap;z-index:9}
#toast.bad{border-color:var(--bad);color:#FFB4AC;background:#2A1412} #toast.good{border-color:var(--ok)}
[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Kioski<small id="summary">Ładowanie…</small></h1>
<div class="row"><button type="button" id="scanb">Szukaj w sieci</button><button type="button" class="primary" id="addb">Dodaj kiosk</button></div></header>

<div class="card upd" id="addonupd" hidden></div>
<section class="card all" id="allc" hidden aria-labelledby="h-all"><h2 id="h-all">Wszystkie kioski naraz</h2>
<div class="grid">
<form id="sayf"><label for="say">Powiedz na wszystkich</label><div class="row"><input id="say" maxlength="1000" placeholder="Obiad gotowy!"><button class="primary">Powiedz</button></div></form>
<form id="bubf"><label for="bub">Dymek na wszystkich (15 s)</label><div class="row"><input id="bub" maxlength="600" placeholder="Wychodzimy za 5 minut"><button>Pokaż</button></div></form>
<div><label for="allview">Widok na wszystkich</label><div class="row"><select id="allview" style="flex:1"></select><button type="button" id="allviewb">Pokaż</button></div></div>
<div><label>Ekran i system</label><div class="row"><button type="button" data-all="screen-on">Włącz ekrany</button><button type="button" data-all="screen-off">Wyłącz ekrany</button><button type="button" data-all="restart">Odśwież</button></div></div>
<div><label>Aktualizacja kiosk-setup</label><div class="row"><button type="button" class="primary" data-all="update-github">Aktualizuj wszystkie z GitHuba</button><label class="btn"><input type="file" id="deb" accept=".deb" hidden> Wgraj .deb na wszystkie…</label></div><div class="hint" id="latestinfo"></div></div>
</div></section>

<div class="kiosks" id="kiosks"></div>
<p class="empty" id="empty" hidden>Nie ma jeszcze kiosków. Kliknij <b>Szukaj w sieci</b> albo <b>Dodaj kiosk</b>.</p>
</main>

<dialog id="dlg"><form id="addf" method="dialog">
<h2>Dodaj kiosk</h2>
<label for="ahost">Adres kiosku</label><input id="ahost" class="mono" placeholder="192.168.0.214" autocomplete="off" required>
<label for="atok">Token kiosku</label><input id="atok" type="password" autocomplete="off" required placeholder="na kiosku: sudo kiosk-mode api-token">
<p class="hint">Token wypisze polecenie <code>sudo kiosk-mode api-token</code> na kiosku (SSH). Dodatek przechowuje go u siebie i loguje się do kiosku za Ciebie.</p>
<div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" id="acancel">Anuluj</button><button class="primary" id="aok">Dodaj</button></div>
</form></dialog>

<dialog id="sdlg"><h2>Kioski w sieci</h2>
<div class="row"><input id="snet" placeholder="sieć, np. 192.168.0.0/24 (puste = automatycznie)" style="flex:1"><button type="button" class="primary" id="sgo">Szukaj</button></div>
<p class="hint" id="sinfo"></p><table><tbody id="sres"></tbody></table>
<div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" id="sclose">Zamknij</button></div></dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
const $=id=>document.getElementById(id);
let T; function toast(t,c){ const m=$('toast'); m.textContent=t; m.className=c||''; m.hidden=false; clearTimeout(T); T=setTimeout(()=>m.hidden=true, c==='bad'?9000:4500); }
async function api(path, opts){ const r=await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{})); const j=await r.json().catch(()=>({error:'Błąd '+r.status})); if(!r.ok) throw new Error(j.error||('Błąd '+r.status)); return j; }
const post=(p,b)=>api(p,{method:'POST', body:JSON.stringify(b||{})});
const el=(tag, props, ...kids)=>{ const e=Object.assign(document.createElement(tag), props||{}); e.append(...kids.filter(k=>k!=null)); return e; };
const fmtUp=s=>{ const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return (d?d+' d ':'')+h+' h '+m+' min'; };
const NETN={lan:'LAN', wifi:'Wi-Fi', internet:'Internet', ha:'HA', mqtt:'MQTT'};
function netChip(n){ if(!n) return null; const keys=Object.keys(NETN).filter(k=>n[k]); if(!keys.length) return null;
  const sp=el('span',null,el('b',{textContent:'Sieć'})); keys.forEach((k,i)=>{ const it=n[k]; const d=el('span',{className:'dot'+(it.state==='bad'?' err':' on'), style:'margin:0 4px 0 '+(i?'8px':'0')+(it.state==='warn'?';background:var(--amber)':'')}); sp.append(d, NETN[k]); }); return sp; }
const MODES={web:'Strona', rtsp:'Kamery', mix:'Strona + kamery', usb:'Kamera USB'};
let KIOSKS=[], STATE={}, LATEST={};

async function busy(btn, fn){ if(btn) btn.disabled=true; try{ return await fn(); } finally{ if(btn) btn.disabled=false; } }

function card(k){
  const s=STATE[k.id]||{}; const st=s.status;
  const dot=el('span',{className:'dot'+(st?' on':(s.error?' err':''))});
  const name=el('div',{className:'name'}, dot, st ? 'Kiosk '+(st.name||st.hostname) : k.host);
  const sub=el('div',{className:'sub', textContent: k.host+(st?' · '+st.hostname+' · wersja '+(st.version||'?'):'')});
  if(st && st.version){ const want=st.latest_version||LATEST[st.edition==='light'?'light':'full']; const old=want && newer(want, st.version);
    sub.append(el('span',{className:'vbadge'+(old?' new':''), textContent: old?'↑ dostępna '+want:'aktualna'})); }
  const top=el('div',{className:'top'}, el('div',null,name,sub));
  const c=el('article',{className:'card k'+(st?'':' off')}, top);
  if(s.error){ c.append(el('div',{className:'err', textContent:'Brak połączenia: '+s.error})); }
  if(st){
    const chip=(b,t)=>el('span',null,el('b',{textContent:b}),t);
    c.append(el('div',{className:'chips'}, chip('Ekran', (MODES[st.mode]||st.mode)+(st.view?' · '+st.view:'')), chip('Monitor', st.screen==='on'?'włączony':(st.screen==='off'?'wyłączony':'?')),
      chip('Kamery', String(st.camera_players)), st.ro?chip('Dysk','tylko odczyt'):null, chip('Czas pracy', fmtUp(st.uptime_s||0)), netChip(st.net),
      st.now_playing&&st.now_playing.state==='playing' ? chip('Gra', [st.now_playing.artist, st.now_playing.title||st.now_playing.station].filter(Boolean).join(' — ').slice(0,50)) : null));
    const sel=el('select',{'aria-label':'Widok'}); sel.append(el('option',{value:'',textContent:'— widok —'}));
    (s.views||[]).forEach(v=>sel.append(el('option',{value:v,textContent:v,selected:v===st.view})));
    sel.onchange=()=>{ if(sel.value) kpost(k,'/api/view',{name:sel.value},'Widok „'+sel.value+'”'); };
    const scr=el('button',{type:'button', textContent: st.screen==='off'?'Włącz ekran':'Wyłącz ekran'});
    scr.onclick=()=>busy(scr,()=>kpost(k,'/api/screen',{on:st.screen==='off'}));
    const open=el('a',{className:'btn primary', href:'k/'+k.id+'/', textContent:'Otwórz panel'});
    const want=st.latest_version||LATEST[st.edition==='light'?'light':'full'];
    const upb=(want && st.version && newer(want, st.version)) ? el('button',{type:'button', textContent:'Aktualizuj do '+want}) : null;
    if(upb) upb.onclick=()=>{ if(confirm('Zaktualizować kiosk '+(st.name||k.host)+' do '+want+'? Ustawienia zostają.')) busy(upb,()=>kpost(k,'/api/update/github',{},'Aktualizacja uruchomiona — kilka minut')); };
    const del=el('button',{type:'button', className:'danger', textContent:'Usuń z listy'});
    del.onclick=()=>{ if(confirm('Usunąć '+k.host+' z listy? (kiosk działa dalej)')) api('api/kiosks/'+k.id,{method:'DELETE'}).then(()=>{ toast('Usunięto z listy','good'); load(); }).catch(e=>toast(e.message,'bad')); };
    c.append(el('div',{className:'acts'}, open, upb, scr, el('div',{className:'wide'}, sel), del));
  } else {
    const del=el('button',{type:'button', className:'danger', textContent:'Usuń z listy'});
    del.onclick=()=>{ if(confirm('Usunąć '+k.host+' z listy?')) api('api/kiosks/'+k.id,{method:'DELETE'}).then(load); };
    const ed=el('button',{type:'button', textContent:'Zmień token'}); ed.onclick=()=>openAdd(k.host);
    c.append(el('div',{className:'acts'}, ed, del));
  }
  return c;
}
function render(){
  $('kiosks').replaceChildren(...KIOSKS.map(card));
  $('empty').hidden=KIOSKS.length>0; $('allc').hidden=KIOSKS.length===0;
  const online=KIOSKS.filter(k=>(STATE[k.id]||{}).status).length;
  $('summary').textContent=KIOSKS.length ? online+' z '+KIOSKS.length+' w sieci' : 'Panel administracyjny kiosków';
  const views=new Set(); KIOSKS.forEach(k=>((STATE[k.id]||{}).views||[]).forEach(v=>views.add(v)));
  const cur=$('allview').value; $('allview').replaceChildren(...[...views].sort((a,b)=>a.localeCompare(b,'pl')).map(v=>el('option',{value:v,textContent:v})));
  if(cur) $('allview').value=cur; if(!views.size) $('allview').append(el('option',{value:'',textContent:'(brak zapisanych widoków)'}));
}
async function refresh(k){
  try{ const st=await api('k/'+k.id+'/api/status'); const v=await api('k/'+k.id+'/api/views').catch(()=>({}));
       STATE[k.id]={status:st, views:Object.keys(v||{})}; }
  catch(e){ STATE[k.id]={error:e.message}; }
}
const vparts=v=>String(v||'').replace(/^\d+:/,'').split(/[^0-9]+/).filter(Boolean).map(Number);
function newer(a,b){ const x=vparts(a), y=vparts(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d>0; } return false; }
async function loadLatest(){ try{ LATEST=await api('api/latest');
  $('latestinfo').textContent='Najnowsze wydanie: '+(LATEST.full||'?')+(LATEST.light?' (light: '+LATEST.light+')':'');
  const b=$('addonupd'); if(LATEST.addon && newer(LATEST.addon, LATEST.addon_installed)){ b.hidden=false; b.textContent='Nowa wersja dodatku Kioski: '+LATEST.addon+' (masz '+LATEST.addon_installed+'). Zaktualizuj: Ustawienia → Aktualizacje albo Ustawienia → Dodatki → Kioski → Aktualizuj.'; } else b.hidden=true; }catch(e){} }
async function load(){ try{ await loadLatest(); KIOSKS=(await api('api/kiosks')).kiosks; await Promise.all(KIOSKS.map(refresh)); render(); } catch(e){ toast(e.message,'bad'); } }
async function kpost(k, path, body, okMsg){ try{ const r=await post('k/'+k.id+path, body); toast(okMsg||r.output||'Gotowe','good'); setTimeout(()=>refresh(k).then(render), 1500); } catch(e){ toast('Kiosk '+k.host+': '+e.message,'bad'); } }
async function all(path, body, label, btn){
  const on=KIOSKS.filter(k=>(STATE[k.id]||{}).status); if(!on.length) return toast('Żaden kiosk nie odpowiada','bad');
  await busy(btn, async()=>{ const res=await Promise.all(on.map(k=>post('k/'+k.id+path, body).then(()=>null).catch(e=>'Kiosk '+k.host+': '+e.message)));
    const bad=res.filter(Boolean); toast(bad.length ? bad.join('\n') : label+' — '+on.length+' kiosk(i)', bad.length?'bad':'good'); setTimeout(load, 2000); });
}
$('sayf').onsubmit=e=>{ e.preventDefault(); const t=$('say').value.trim(); if(t) all('/api/say',{text:t},'Powiedziano',e.submitter).then(()=>$('say').value=''); };
$('bubf').onsubmit=e=>{ e.preventDefault(); const t=$('bub').value.trim(); if(t) all('/api/bubble',{text:t, seconds:15},'Dymek pokazany',e.submitter).then(()=>$('bub').value=''); };
$('allviewb').onclick=e=>{ const v=$('allview').value; if(v) all('/api/view',{name:v},'Widok „'+v+'”',e.target); };
const ALL={'screen-on':['/api/screen',{on:true},'Ekrany włączone'], 'screen-off':['/api/screen',{on:false},'Ekrany wyłączone'], 'restart':['/api/restart',{},'Odświeżono'], 'update-check':['/api/update/check',{},'Sprawdzanie aktualizacji uruchomione'], 'update-github':['/api/update/github',{},'Aktualizacja z GitHuba uruchomiona']};
document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{ const a=ALL[b.dataset.all]; all(a[0],a[1],a[2],b); });
$('deb').onchange=async()=>{ const f=$('deb').files[0]; $('deb').value=''; if(!f) return;
  const on=KIOSKS.filter(k=>(STATE[k.id]||{}).status); if(!confirm('Zainstalować '+f.name+' na '+on.length+' kiosk(ach)? Ustawienia zostają.')) return;
  toast('Wysyłam '+f.name+'…','good');
  const res=await Promise.all(on.map(async k=>{ try{ const r=await fetch('k/'+k.id+'/api/update/upload',{method:'POST', body:f, headers:{'Content-Type':'application/vnd.debian.binary-package'}}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('Błąd '+r.status)); return null; } catch(e){ return 'Kiosk '+k.host+': '+e.message; } }));
  const bad=res.filter(Boolean); toast(bad.length?bad.join('\n'):'Aktualizacja wysłana — kioski instalują ją same (kilka minut).', bad.length?'bad':'good'); setTimeout(load, 60000); };

function openAdd(host){ $('ahost').value=host||''; $('atok').value=''; $('dlg').showModal(); (host?$('atok'):$('ahost')).focus(); }
$('addb').onclick=()=>openAdd(); $('acancel').onclick=()=>$('dlg').close();
$('addf').onsubmit=e=>{ e.preventDefault(); busy($('aok'), async()=>{ try{ const r=await post('api/kiosks',{host:$('ahost').value.trim(), token:$('atok').value.trim()}); $('dlg').close(); toast(r.output,'good'); load(); } catch(err){ toast(err.message,'bad'); } }); };
$('scanb').onclick=()=>{ $('sdlg').showModal(); doScan(); };
$('sclose').onclick=()=>$('sdlg').close();
$('sgo').onclick=()=>doScan();
async function doScan(){ $('sinfo').textContent='Szukam… (do kilkunastu sekund)'; $('sres').replaceChildren();
  try{ const r=await post('api/scan',{network:$('snet').value.trim()}); $('sinfo').textContent='Sieci: '+(r.networks.join(', ')||'—')+'. Znalezione kioski: '+r.found.length+'.';
    $('sres').replaceChildren(...r.found.map(f=>{ const b=el('button',{type:'button', className:f.known?'':'primary', textContent:f.known?'Na liście':'Dodaj'}); b.disabled=f.known; b.onclick=()=>{ $('sdlg').close(); openAdd(f.host); };
      return el('tr',null, el('td',null, el('b',{textContent:'Kiosk '+(f.name||f.hostname)}), el('div',{className:'hint', textContent:f.host+' · '+(f.version||'?')})), el('td',{style:'text-align:right'}, b)); })); }
  catch(e){ $('sinfo').textContent=e.message; } }
load(); setInterval(()=>Promise.all(KIOSKS.map(refresh)).then(render), 20000);
</script></body></html>
