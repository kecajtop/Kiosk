name: Dashboard RTSP
version: "1.4.2"
slug: dashboard_rtsp
description: Streamuje wybrane dashboardy/widoki Home Assistant jako kamery RTSP (do NVR, kiosk-setup, itp.)
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8098
ingress_stream: true
panel_icon: mdi:cctv
panel_title: Dashboard RTSP
hassio_api: true
homeassistant_api: true
ports:
  8554/tcp: 8554
  8099/tcp: 8099
ports_description:
  8554/tcp: Serwer RTSP (MediaMTX) — jedno gniazdo, wiele strumieni pod różnymi ścieżkami (jedną na dashboard)
  8099/tcp: Podgląd JPG/MJPEG bez logowania (jak RTSP) — /snapshot/<id>.jpg i /mjpeg/<id>, do NVR/kamery generycznej w HA
options: {}
schema: {}
