# Minimalna konfiguracja MediaMTX dla dodatku Dashboard RTSP: tylko RTSP, bez HLS/WebRTC/SRT
# (niepotrzebne, mniejsza powierzchnia ataku). Strumienie publikuje lokalnie ffmpeg (127.0.0.1),
# odczytują je dowolni klienci RTSP w sieci (NVR, kiosk-setup, VLC...).
rtsp: yes
rtspAddress: :8554
hls: no
webrtc: no
srt: no
rtmp: no
api: no
metrics: no
pprof: no
logLevel: warn

# Nasz plik całkowicie zastępuje domyślny mediamtx.yml (nie jest z nim scalany), a domyślny
# katalog "all_others" (zezwala na publikowanie/odczyt dowolnej nowej nazwy ścieżki, tu:
# jednej na dashboard) jest wtedy pomijany -> ffmpeg dostawał "400 Bad Request" na ANNOUNCE,
# bo serwer w ogóle nie miał zdefiniowanej żadnej ścieżki do publikacji. Trzeba go wypisać
# jawnie.
paths:
  all_others:
