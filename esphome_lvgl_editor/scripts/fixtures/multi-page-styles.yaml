substitutions:
  device_name: multi-page-kiosk

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: boot_count
    type: int
    restore_value: true
    initial_value: '0'

script:
  - id: blink_status_led
    then:
      - light.toggle: status_led

interval:
  - interval: 60s
    then:
      - script.execute: blink_status_led

font:
  - file: "fonts/Roboto-Regular.ttf"
    id: font_small
    size: 14
  - file: "fonts/Roboto-Bold.ttf"
    id: font_large
    size: 24

display:
  - platform: ili9xxx
    id: kiosk_display

lvgl:
  style_definitions:
    - id: card_style
      bg_color: 0x1E1E1E
      radius: 8
      pad_all: 10
    - id: accent_text
      text_color: 0x4EC94E
      text_font: font_large
  top_layer:
    widgets:
      - label:
          id: clock_overlay
          text: "00:00"
          x: -60
          y: 5
          text_font: font_small
  pages:
    - id: home_page
      widgets:
        - label:
            id: home_title
            text: "Home"
            styles: [accent_text]
            x: 10
            y: 10
        - arc:
            id: temp_arc
            x: 10
            y: 40
            min_value: 0
            max_value: 40
            value: 21
        - bar:
            id: humidity_bar
            x: 10
            y: 120
            min_value: 0
            max_value: 100
            value: 55
        - checkbox:
            id: night_mode_checkbox
            x: 10
            y: 160
            text: "Night mode"
            on_value:
              - lambda: |-
                  if (x) {
                    id(boot_count) += 1;
                  }
    - id: settings_page
      widgets:
        - dropdown:
            id: theme_dropdown
            x: 10
            y: 10
            options: "Dark\nLight"
        - roller:
            id: volume_roller
            x: 10
            y: 60
            options: "0\n25\n50\n75\n100"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
