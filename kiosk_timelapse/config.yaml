name: Timelapse RTSP
version: "1.1.1"
slug: timelapse_rtsp
description: Nagrywa poklatkowe filmy (timelapse) z dowolnych strumieni RTSP (kamer, NVR) według harmonogramu
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8097
ingress_stream: true
panel_icon: mdi:movie-filter
panel_title: Timelapse RTSP
hassio_api: true
homeassistant_api: true
# Domyślna sieć Dockera dodatków (bridge) nie ma trasy do zwykłych urządzeń w sieci LAN
# użytkownika (np. kamer IP) - ffmpeg zgłaszał "Host is unreachable" mimo poprawnego
# adresu RTSP. host_network daje dodatkowi dokładnie taki dostęp do sieci, jaki ma sam
# host Home Assistant (tak jak zwykły serwis RTSP/NVR by miał). Panel (Ingress) i tak
# odrzuca połączenia spoza Supervisora/loopbacku (patrz allowed() w server.py), więc to
# nie otwiera panelu na całą sieć LAN.
host_network: true
map:
  - media:rw
  - share:rw
options: {}
schema: {}
